# Sestaví web (Tailwind + Zola) a nasadí obsah public/ přes rsync/SSH
# do /srv/data/bluemonkey na produkčním serveru (stock httpd + Traefik).
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # umožní ruční spuštění z GitHubu

# Nikdy neběží dvě nasazení naráz; novější push zruší rozběhnuté starší.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  ZOLA_VERSION: "0.22.1" # dle CLAUDE.md testováno na této verzi

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalace npm závislostí
        run: npm ci

      # Zola Tailwind nespouští — CSS je nutné vygenerovat PŘED zola build.
      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Instalace Zoly
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/zola.tar.gz
          sudo tar -xzf /tmp/zola.tar.gz -C /usr/local/bin
          zola --version

      # Použije base_url z zola.toml (https://bluemonkey.cz) → správné absolutní URL.
      - name: Build webu (→ public/)
        run: zola build

      - name: Příprava SSH klíče
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Lomítko za public/ = kopíruje se OBSAH složky do kořene webu.
      # --delete odstraní na serveru soubory, které web už neobsahuje.
      - name: Nasazení přes rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT || '22' }}" \
            public/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
