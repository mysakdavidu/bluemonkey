<svg class="stageplan-svg" viewBox="0 0 1240 1780" role="img" aria-labelledby="stageplan-title stageplan-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="stageplan-title">Stage plan Blue Monkey</title>
  <desc id="stageplan-desc">Rozmístění kapely na pódiu, monitorový mix a routing signálu do FOH.</desc>

  <defs>
    <style>
      .sp text { font-family: 'Barlow', 'Montserrat', sans-serif; fill: #f3f6ff; }
      .sp .display { font-family: 'Bowlby One SC', Impact, sans-serif; }
      .sp .title { font-size: 56px; letter-spacing: 1px; }
      .sp .subtitle { font-size: 18px; fill: #69a3ff; letter-spacing: 6px; }
      .sp .tag { font-size: 15px; fill: #171034; font-weight: 800; letter-spacing: 1.5px; }
      .sp .slabel { font-size: 16px; fill: #aab6ea; letter-spacing: 4px; }
      .sp .name { font-size: 20px; letter-spacing: 0.6px; }
      .sp .role { font-size: 14px; fill: #cfd7f6; }
      .sp .detail { font-size: 12.5px; fill: #9aa6db; }
      .sp .node { font-size: 15px; font-weight: 600; }
      .sp .node-sm { font-size: 13.5px; font-weight: 600; }
      .sp .aux { font-size: 13px; fill: #f7cf3f; font-weight: 800; letter-spacing: 1.5px; }
      .sp .flowlbl { font-size: 12.5px; fill: #b9c3ef; font-style: italic; }
      .sp .note { font-size: 15px; fill: #e7ecff; }
      .sp .small { font-size: 12px; fill: #9aa6db; font-style: italic; }

      .sp .panel { fill: #20264f; stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
      .sp .ring { fill: none; stroke: #f7cf3f; stroke-width: 3.5; }
      .sp .ring-blue { fill: none; stroke: #69a3ff; stroke-width: 3.5; }
      .sp .wedge { fill: #2b2f63; stroke: #69a3ff; stroke-width: 2; }
      .sp .box { fill: #2f2b8c; stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
      .sp .box-src { fill: #26305f; stroke: #69a3ff; stroke-width: 1.8; }
      .sp .box-foh { fill: #3a3aa8; stroke: #f7cf3f; stroke-width: 2.2; }
      .sp .box-aux { fill: #222a55; stroke: rgba(255,255,255,0.2); stroke-width: 1.4; }
      .sp .notes-box { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.14); stroke-width: 1.4; }
      .sp .glyph-fill { fill: #cfe0ff; }

      .sp .flow { stroke: #8ea6ef; stroke-width: 2.6; fill: none; }
      .sp .flow-dash { stroke-dasharray: 8 7; }
      .sp .flow-click { stroke: #f7cf3f; stroke-width: 2.6; fill: none; }
      .sp .bus { stroke: #8ea6ef; stroke-width: 2.6; fill: none; }
    </style>

    <marker id="sp-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ea6ef" />
    </marker>
    <marker id="sp-arrow-y" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7cf3f" />
    </marker>

    <linearGradient id="sp-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3168" />
      <stop offset="100%" stop-color="#141936" />
    </linearGradient>
    <linearGradient id="sp-riser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4487" />
      <stop offset="100%" stop-color="#2a3168" />
    </linearGradient>

    <clipPath id="clip-ales"><circle cx="620" cy="352" r="46" /></clipPath>
    <clipPath id="clip-michal"><circle cx="262" cy="636" r="52" /></clipPath>
    <clipPath id="clip-jana"><circle cx="620" cy="664" r="58" /></clipPath>
    <clipPath id="clip-martin"><circle cx="978" cy="636" r="52" /></clipPath>
  </defs>

  <g class="sp">
    <!-- ================= TITLE ================= -->
    <text x="620" y="72" text-anchor="middle" class="display title">STAGE PLAN</text>
    <text x="620" y="106" text-anchor="middle" class="subtitle">PÓDIUM · MONITOROVÝ MIX · FOH ROUTING</text>

    <!-- ================= PANEL 1: STAGE PLOT ================= -->
    <rect x="30" y="140" width="1180" height="880" rx="30" class="panel" />

    <rect x="56" y="166" width="276" height="34" rx="17" fill="#f7cf3f" />
    <text x="194" y="189" text-anchor="middle" class="display tag">1 · TOP-DOWN STAGE PLOT</text>

    <text x="620" y="286" text-anchor="middle" class="slabel">ZADNÍ ČÁST PÓDIA</text>

    <!-- perspective stage floor -->
    <polygon points="250,300 990,300 1120,946 120,946" fill="url(#sp-floor)" stroke="#3a63b8" stroke-width="2" />
    <!-- perspective guide lines -->
    <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
      <line x1="620" y1="300" x2="620" y2="946" />
      <line x1="435" y1="300" x2="315" y2="946" />
      <line x1="805" y1="300" x2="925" y2="946" />
      <line x1="205" y1="516" x2="1035" y2="516" />
      <line x1="162" y1="730" x2="1078" y2="730" />
    </g>

    <!-- drum riser (back center) -->
    <polygon points="512,404 728,404 706,318 534,318" fill="url(#sp-riser)" stroke="#5566b8" stroke-width="1.5" />

    <!-- Aleš (drums) -->
    <image href="/img/hero-members/ales.png" x="574" y="306" width="92" height="92" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-ales)" />
    <circle cx="620" cy="352" r="46" class="ring" />
    <text x="620" y="430" text-anchor="middle" class="display name">ALEŠ</text>
    <text x="620" y="450" text-anchor="middle" class="role">bicí</text>
    <text x="620" y="468" text-anchor="middle" class="detail">kick · snare · hi-hat · 3× tom</text>

    <!-- Michal (guitar) -->
    <image href="/img/hero-members/michal.png" x="210" y="584" width="104" height="104" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-michal)" />
    <circle cx="262" cy="636" r="52" class="ring" />
    <text x="262" y="716" text-anchor="middle" class="display name">MICHAL</text>
    <text x="262" y="735" text-anchor="middle" class="role">kytarista</text>
    <text x="262" y="753" text-anchor="middle" class="detail">vocal + IEM + kytara (pedalboard)</text>

    <!-- Jana (vocals) -->
    <image href="/img/hero-members/jana.png" x="562" y="606" width="116" height="116" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-jana)" />
    <circle cx="620" cy="664" r="58" class="ring" />
    <text x="620" y="750" text-anchor="middle" class="display name">JANA</text>
    <text x="620" y="769" text-anchor="middle" class="role">zpěvačka</text>
    <text x="620" y="787" text-anchor="middle" class="detail">vocal + IEM</text>

    <!-- Martin (bass) -->
    <image href="/img/hero-members/martin.jpeg" x="926" y="584" width="104" height="104" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-martin)" />
    <circle cx="978" cy="636" r="52" class="ring" />
    <text x="978" y="716" text-anchor="middle" class="display name">MARTIN</text>
    <text x="978" y="735" text-anchor="middle" class="role">basák</text>
    <text x="978" y="753" text-anchor="middle" class="detail">vocal + IEM + baskytara</text>

    <!-- monitor wedges -->
    <g>
      <polygon points="350,906 470,906 452,866 388,866" class="wedge" />
      <circle cx="420" cy="886" r="10" fill="none" stroke="#69a3ff" stroke-width="2" />
      <text x="410" y="932" text-anchor="middle" class="detail">Yamaha monitor L</text>
    </g>
    <g>
      <polygon points="770,906 890,906 852,866 788,866" class="wedge" />
      <circle cx="830" cy="886" r="10" fill="none" stroke="#69a3ff" stroke-width="2" />
      <text x="840" y="932" text-anchor="middle" class="detail">Yamaha monitor R</text>
    </g>

    <!-- stage mix box + splitter (center front) -->
    <text x="620" y="838" text-anchor="middle" class="detail">BEDNA se stage mixem + čtecí zařízení</text>
    <rect x="505" y="850" width="230" height="52" rx="10" class="box" />
    <g stroke="#9fb4f2" stroke-width="1.6">
      <line x1="527" y1="862" x2="527" y2="890" /><line x1="545" y1="862" x2="545" y2="890" />
      <line x1="563" y1="862" x2="563" y2="890" /><line x1="581" y1="862" x2="581" y2="890" />
    </g>
    <text x="648" y="872" text-anchor="middle" class="node-sm">Soundcraft</text>
    <text x="648" y="890" text-anchor="middle" class="detail">monitor mix</text>

    <rect x="545" y="908" width="150" height="32" rx="9" fill="#2b2f63" stroke="#f7cf3f" stroke-width="1.8" />
    <text x="620" y="929" text-anchor="middle" class="node-sm">XLR splitter</text>

    <text x="620" y="986" text-anchor="middle" class="slabel">PŘEDNÍ HRANA PÓDIA · PUBLIKUM</text>

    <!-- ================= PANEL 2: SIGNAL FLOW ================= -->
    <rect x="30" y="1050" width="1180" height="700" rx="30" class="panel" />

    <rect x="56" y="1076" width="238" height="34" rx="17" fill="#f7cf3f" />
    <text x="175" y="1099" text-anchor="middle" class="display tag">2 · SIGNÁL &amp; ROUTING</text>

    <!-- sources -->
    <rect x="70" y="1150" width="300" height="54" rx="12" class="box-src" />
    <text x="220" y="1183" text-anchor="middle" class="node">Zpěvy + kytara + baskytara</text>

    <rect x="70" y="1224" width="300" height="54" rx="12" class="box-src" />
    <text x="220" y="1257" text-anchor="middle" class="node">Podklady z přehrávače</text>

    <rect x="70" y="1298" width="300" height="54" rx="12" fill="#3a2f3a" stroke="#f7cf3f" stroke-width="1.8" />
    <text x="220" y="1331" text-anchor="middle" class="node">Click z přehrávače</text>
    <text x="220" y="1372" text-anchor="middle" class="small">jen do IEM, ne do FOH</text>

    <!-- hubs -->
    <rect x="470" y="1178" width="210" height="60" rx="12" fill="#2b2f63" stroke="#f7cf3f" stroke-width="2" />
    <text x="575" y="1214" text-anchor="middle" class="node">XLR splitter</text>

    <rect x="470" y="1286" width="230" height="66" rx="12" class="box" />
    <text x="585" y="1316" text-anchor="middle" class="node">Soundcraft</text>
    <text x="585" y="1336" text-anchor="middle" class="role">monitor mix</text>

    <!-- FOH -->
    <rect x="930" y="1178" width="220" height="66" rx="12" class="box-foh" />
    <text x="1040" y="1208" text-anchor="middle" class="node">FOH / stagebox</text>
    <text x="1040" y="1228" text-anchor="middle" class="role">zvukaře</text>

    <!-- Bicí direct -->
    <rect x="760" y="1300" width="150" height="50" rx="12" class="box" />
    <text x="835" y="1330" text-anchor="middle" class="node">Bicí</text>

    <!-- flows: sources -> hubs -->
    <path d="M370 1177 L470 1200" class="flow" marker-end="url(#sp-arrow)" />
    <path d="M370 1195 C 420 1220, 430 1300, 470 1312" class="flow" marker-end="url(#sp-arrow)" />
    <path d="M370 1251 L470 1218" class="flow flow-dash" marker-end="url(#sp-arrow)" />
    <path d="M370 1258 L470 1305" class="flow flow-dash" marker-end="url(#sp-arrow)" />
    <path d="M370 1325 L470 1322" class="flow-click" marker-end="url(#sp-arrow-y)" />

    <!-- splitter -> FOH -->
    <path d="M680 1204 L930 1206" class="flow" marker-end="url(#sp-arrow)" />
    <text x="805" y="1188" text-anchor="middle" class="flowlbl">split / send (i podklady)</text>

    <!-- Bicí -> FOH (bypass) -->
    <path d="M910 1318 C 990 1310, 1040 1290, 1040 1244" class="flow" marker-end="url(#sp-arrow)" />
    <text x="835" y="1372" text-anchor="middle" class="small">obcházejí Soundcraft</text>

    <!-- Soundcraft -> AUX bus -->
    <path d="M585 1352 L585 1440 L159 1440 L159 1470 M585 1440 L341 1440 L341 1470 M585 1440 L523 1440 L523 1470 M585 1440 L705 1440 L705 1470 M585 1440 L887 1440 L887 1470 M585 1440 L1069 1440 L1069 1470" class="bus" />

    <!-- AUX outputs -->
    <g>
      <text x="159" y="1462" text-anchor="middle" class="aux">AUX 1</text>
      <rect x="75" y="1470" width="168" height="74" rx="12" class="box-aux" />
      <text x="159" y="1502" text-anchor="middle" class="node-sm">IEM Jana</text>
      <text x="159" y="1522" text-anchor="middle" class="role">(zpěv)</text>
    </g>
    <g>
      <text x="341" y="1462" text-anchor="middle" class="aux">AUX 2</text>
      <rect x="257" y="1470" width="168" height="74" rx="12" class="box-aux" />
      <text x="341" y="1502" text-anchor="middle" class="node-sm">IEM Michal</text>
      <text x="341" y="1522" text-anchor="middle" class="role">(kytara)</text>
    </g>
    <g>
      <text x="523" y="1462" text-anchor="middle" class="aux">AUX 3</text>
      <rect x="439" y="1470" width="168" height="74" rx="12" class="box-aux" />
      <text x="523" y="1502" text-anchor="middle" class="node-sm">IEM Martin</text>
      <text x="523" y="1522" text-anchor="middle" class="role">(baskytara)</text>
    </g>
    <g>
      <text x="705" y="1462" text-anchor="middle" class="aux">AUX 4</text>
      <rect x="621" y="1470" width="168" height="74" rx="12" class="box-aux" />
      <text x="705" y="1502" text-anchor="middle" class="node-sm">Drummer IEM</text>
      <text x="705" y="1522" text-anchor="middle" class="role">(volitelné)</text>
    </g>
    <g>
      <text x="887" y="1462" text-anchor="middle" class="aux">AUX 5</text>
      <rect x="803" y="1470" width="168" height="74" rx="12" class="box-aux" />
      <text x="887" y="1502" text-anchor="middle" class="node-sm">Yamaha</text>
      <text x="887" y="1522" text-anchor="middle" class="role">monitor L</text>
    </g>
    <g>
      <text x="1069" y="1462" text-anchor="middle" class="aux">AUX 6</text>
      <rect x="985" y="1470" width="168" height="74" rx="12" class="box-aux" />
      <text x="1069" y="1502" text-anchor="middle" class="node-sm">Yamaha</text>
      <text x="1069" y="1522" text-anchor="middle" class="role">monitor R</text>
    </g>

    <!-- notes -->
    <rect x="70" y="1596" width="1080" height="126" rx="14" class="notes-box" />
    <g>
      <circle cx="96" cy="1636" r="4" class="glyph-fill" />
      <text x="112" y="1641" class="note">Soundcraft slouží pouze pro pódiový mix.</text>
      <circle cx="96" cy="1676" r="4" class="glyph-fill" />
      <text x="112" y="1681" class="note">Bicí jdou přímo do stageboxu zvukaře.</text>
      <circle cx="616" cy="1636" r="4" class="glyph-fill" />
      <text x="632" y="1641" class="note">FOH dostává zpěvy, nástroje a podklady přes splitter.</text>
      <circle cx="616" cy="1676" r="4" class="glyph-fill" />
      <text x="632" y="1681" class="note">Click pouze do in-earů.</text>
    </g>
  </g>
</svg>
